plugins {
    id 'com.android.application'
}

android {
    namespace 'rs.local.mojpritisak'
    compileSdk 35

    defaultConfig {
        applicationId 'rs.local.mojpritisak'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Bundled on-device OCR. Does not need a server or network permission.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'androidx.core:core:1.15.0'
}
