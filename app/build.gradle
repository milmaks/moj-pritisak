plugins {
    id 'com.android.application'
}

android {
    namespace 'rs.local.mojpritisak'
    compileSdk 35

    defaultConfig {
        applicationId 'rs.local.mojpritisak'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Kotlin 1.8+ includes the old jdk7/jdk8 extension classes.
    // Keep transitive Kotlin libraries on the same version to avoid duplicates.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    // Bundled on-device OCR. Does not need a server or network permission.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'androidx.core:core:1.15.0'
}
